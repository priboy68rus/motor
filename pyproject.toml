[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-reports"
dynamic = ["version"]
description = "Compiler for trusted portable BI artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "motor contributors" }]
dependencies = [
  "Jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/priboy68rus/motor"
Documentation = "https://github.com/priboy68rus/motor/tree/master/docs"
Repository = "https://github.com/priboy68rus/motor"
Issues = "https://github.com/priboy68rus/motor/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
]

[project.scripts]
motor = "motor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motor = ["templates/*.j2", "static/*"]

[tool.setuptools_scm]
fallback_version = "0.1.1"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
