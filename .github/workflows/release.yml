name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in vX.Y.Z format
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" twine

      - name: Validate installed version
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: >-
          python -c "import motor, os;
          assert motor.__version__ == os.environ['RELEASE_VERSION'],
          (motor.__version__, os.environ['RELEASE_VERSION'])"

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source distribution
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.release-version.outputs.version }}
        run: python -m build

      - name: Check distribution metadata
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          python -m twine check dist/*
          test -f "dist/motor_reports-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/motor_reports-${RELEASE_VERSION}.tar.gz"

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/motor-reports
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
