name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" twine

      - name: Run tests
        run: python -m pytest

      - name: Build and validate package
        run: |
          python -m build
          python -m twine check dist/*

  runtime:
    name: Runtime tests and bundle
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build browser runtime
        run: npm run build

      - name: Verify committed runtime bundle
        working-directory: .
        run: |
          gzip -cd src/motor/static/duckdb-mvp.wasm.gz |
            cmp - runtime/node_modules/@duckdb/duckdb-wasm/dist/duckdb-mvp.wasm
          git diff --exit-code -- src/motor/static \
            ':(exclude)src/motor/static/duckdb-mvp.wasm.gz'
